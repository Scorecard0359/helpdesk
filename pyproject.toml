[project]
name = "helpdesk"
version = "0.1.0"
description = "Корпоративный Helpdesk"
readme = "README.md"
authors = [
    { name = "Scorecard0359", email = "135143366+Scorecard0359@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "sqlalchemy>=2.1.1",
    "waitress>=3.0.2",
]

[project.scripts]
helpdesk = "helpdesk:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

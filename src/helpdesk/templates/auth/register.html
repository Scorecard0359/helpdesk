<!DOCTYPE html>
<html lang="ru" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Helpdesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary h-100">
    <main class="form-auth w-100 m-auto">
        <h3 class="mb-3 fw-normal">Регистрация</h3>
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
        <form method="post">
            <div class="input-group">
                <span class="input-group-text" id="username-addon">@</span>
                <div class="form-floating">
                    <input type="text" class="form-control first" placeholder=" " name="username" id="username" required>
                    <label for="username" class="form-label">Имя пользователя</label>
                </div>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" placeholder=" " name="password" id="password" required>
                <label for="password" class="form-label">Пароль</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" placeholder=" " name="repeat_password" id="repeat_password" required>
                <label for="repeat_password" class="form-label">Повторите пароль</label>
            </div>
            <div class="form-floating">
                <input type="text" class="form-control{% if not config['INVITE_ONLY'] %} last{% endif %}" placeholder=" " name="full_name" id="full_name">
                <label for="full_name" class="form-label">Полное имя (необязательно)</label>
            </div>
            {% if config['INVITE_ONLY'] %}
                <div class="form-floating">
                    <input type="text" class="form-control last" placeholder=" " name="invite_code" id="invite_code" required>
                    <label for="invite_code" class="form-label">Код приглашения</label>
                </div>
            {% else %}
                <input type="hidden" name="invite_code" value=" ">
            {% endif %}
            <input type="submit" class="btn btn-primary w-100 mt-4 py-2" value="Зарегистрироваться">
            <a href="/auth/login" class="btn btn-outline-secondary w-100 my-2 py-2">Есть аккаунт?</a>
        </form>
    </main>
</body>
</html>

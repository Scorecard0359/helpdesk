<!DOCTYPE html>
<html lang="ru" class="page-auth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - Helpdesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary page-auth">
    <main class="form-auth w-100 m-auto">
        <h3 class="mb-3 fw-normal">Авторизация</h3>
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
        <form method="post">
            <div class="input-group">
                <span class="input-group-text" id="username-addon">@</span>
                <div class="form-floating">
                    <input type="text" class="form-control first" placeholder=" " name="username" id="username" required>
                    <label for="username" class="form-label">Имя пользователя</label>
                </div>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control last" placeholder=" " name="password" id="password" required>
                <label for="password" class="form-label">Пароль</label>
            </div>
            <input type="submit" class="btn btn-primary w-100 mt-4 py-2" value="Авторизироваться">
            <a href="/auth/register" class="btn btn-light w-100 my-2 py-2 text-light-emphasis">Нет аккаунта?</a>
        </form>
    </main>
</body>
</html>
